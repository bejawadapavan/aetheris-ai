version: '3.8'

services:
  mongodb:
    image: mongo:7-jammy
    container_name: aetheris-mongodb
    restart: always
    ports:
      - '27017:27017'
    volumes:
      - aetheris_mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: genai_chatbot

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aetheris-web
    restart: always
    ports:
      - '5000:5000'
      - '8000:8000'
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/genai_chatbot
      - CLIENT_URL=http://localhost:5000
    depends_on:
      - mongodb

volumes:
  aetheris_mongo_data:
